[general]
# Name of this workspace
workspace_name = PicCompare-Workspace
# Working directory for input images
input_dir = ./images/input
# Directory where comparison results are saved
output_dir = ./images/output

[comparison]
# Comparison method to use: pixel, histogram, ssim, phash
method = ssim
# Similarity threshold (0.0 - 1.0). Results below this value are flagged as different.
threshold = 0.95
# Resize images to this width x height before comparing (0 = no resize)
resize_width = 0
resize_height = 0
# Convert images to grayscale before comparing (true/false)
grayscale = false

[output]
# Save a side-by-side diff image for each comparison (true/false)
save_diff = true
# Image format for diff output: png, jpg, webp
diff_format = png
# Generate a summary report after batch comparisons (true/false)
generate_report = true
# Report format: txt, csv, json
report_format = json

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO
# Path to log file (leave blank to log to console only)
log_file = ./piccompare.log
